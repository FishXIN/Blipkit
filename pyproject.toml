[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blipkit"
version = "0.1.0"
description = "A lightweight audio workstation for indie game developers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "FishXIN" }]
keywords = ["audio", "game-development", "music", "sfx"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "customtkinter>=5.2.2,<6",
  "numpy>=2.0,<3",
  "soundfile>=0.13,<1",
  "lameenc>=1.8,<2",
  "mido>=1.3,<2",
  "Pillow>=11,<12",
]

[project.urls]
Homepage = "https://github.com/FishXIN/Blipkit"
Issues = "https://github.com/FishXIN/Blipkit/issues"
Source = "https://github.com/FishXIN/Blipkit"

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.16,<7",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
blipkit = "blipkit.cli:main"

[project.gui-scripts]
blipkit-app = "blipkit.ui.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
