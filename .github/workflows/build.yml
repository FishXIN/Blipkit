name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, macos, windows]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2025"]' || inputs.platform == 'macos' && '["macos-15"]' || '["macos-15","windows-2025"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Create environment
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python -m pip install --upgrade pip
            .venv/Scripts/pip install -e ".[dev]"
            .venv/Scripts/pip install --no-deps "tinysoundfont==0.3.7"
          else
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -e ".[dev]"
            .venv/bin/pip install --no-deps "tinysoundfont==0.3.7"
          fi

      - name: Test
        timeout-minutes: 6
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python -u -m pytest -vv -o faulthandler_timeout=60
          else
            .venv/bin/python -u -m pytest -vv -o faulthandler_timeout=60
          fi

      - name: Build macOS
        if: runner.os == 'macOS'
        run: ./build_app.sh

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\build_windows.ps1

      - name: Smoke test packaged app
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python scripts/smoke_packaged.py dist/windows/Blipkit/Blipkit.exe
          else
            .venv/bin/python scripts/smoke_packaged.py dist/Blipkit.app/Contents/MacOS/Blipkit
          fi

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: Blipkit-macOS
          path: |
            dist/Blipkit-*.zip
            dist/checksums.txt

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Blipkit-Windows
          path: |
            dist/Blipkit-*.zip
            dist/checksums-windows.txt
